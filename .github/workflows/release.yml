name: Release binaries

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          name="phab-feedback_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          binary="phab-feedback"
          if [ "$GOOS" = windows ]; then binary="${binary}.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/$name/$binary" ./cmd/phab-feedback
          cp README.md LICENSE "dist/$name/"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -qr "$name.zip" "$name")
            rm -rf "dist/$name"
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phab-feedback-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phab-feedback-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: (cd dist && sha256sum * > checksums.txt)
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
