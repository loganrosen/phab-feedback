name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked ty check --error-on-warning --output-format github

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --locked pytest -v
      - run: uv run --locked phab-feedback --help

  # Single required status check for branch protection, so changing the Python
  # matrix above never requires updating the repository ruleset.
  all-checks:
    name: All checks passed
    needs: [typecheck, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify that every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed (got '$result')."
              exit 1
            fi
          done
