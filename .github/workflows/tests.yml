name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "stable"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/phab-feedback
      - run: go run ./cmd/phab-feedback --help

  all-checks:
    name: All checks passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify that every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed (got '$result')."
              exit 1
            fi
          done
